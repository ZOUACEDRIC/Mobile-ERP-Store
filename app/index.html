<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="Offline-first store operations: inventory, sales, expenses and reporting.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <title>StoreDesk — Mobile ERP</title>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#" aria-label="StoreDesk home">
        <span class="brand-mark">S</span>
        <span><strong>StoreDesk</strong><small>STORE OPERATIONS</small></span>
      </a>
      <div class="workspace-label">WORKSPACE</div>
      <nav class="nav-list" id="navigation" aria-label="Main navigation">
        <button class="nav-item active" data-view="dashboard"><span>▦</span> Overview</button>
        <button class="nav-item" data-view="inventory"><span>▤</span> Inventory</button>
        <button class="nav-item" data-view="sales"><span>↗</span> Sales</button>
        <button class="nav-item" data-view="suppliers"><span>⇄</span> Suppliers</button>
        <button class="nav-item" data-view="expenses"><span>◷</span> Expenses</button>
        <button class="nav-item" data-view="team"><span>♙</span> Team</button>
        <button class="nav-item" data-view="operations"><span>⚙</span> Operations</button>
        <button class="nav-item" data-view="reports"><span>▥</span> Reports</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="offline-status"><span class="status-dot"></span><span><strong>Offline-ready</strong><small>Data stays on this device</small></span></div>
        <button class="nav-item" data-view="settings"><span>⚙</span> Settings & backup</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="mobile-menu" id="mobile-menu" aria-label="Open navigation">☰</button>
        <div><div class="eyebrow" id="today-label">STORE MANAGEMENT</div><h1 id="page-title">Overview</h1></div>
        <div class="top-actions"><span class="local-pill"><span class="status-dot"></span> Local mode</span><button class="primary-btn" data-action="new-sale">＋ New sale</button></div>
      </header>
      <section class="content" id="content" aria-live="polite">
        <div class="loading"><span class="spinner"></span> Opening your store workspace…</div>
      </section>
      <footer class="footer-note">StoreDesk · Your records are saved in this browser on this device. Export backups regularly.</footer>
    </main>
  </div>

  <dialog id="modal" class="modal">
    <div class="modal-head"><div><div class="eyebrow">STORE WORKSPACE</div><h2 id="modal-title">New record</h2></div><button class="icon-btn" id="modal-close" aria-label="Close">×</button></div>
    <div id="modal-body"></div>
  </dialog>
  <div class="toast-region" id="toast-region" aria-live="polite"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
